<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-labelledby="title desc">
  <title id="title">Impact signal divider</title>
  <desc id="desc">A thin blue-to-green signal line with a subtle moving pulse.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61afef" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#61afef" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#98c379" stop-opacity=".9"/>
      <stop offset=".78" stop-color="#61afef" stop-opacity=".7"/>
      <stop offset="1" stop-color="#61afef" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 18H1200" stroke="#2b3954" stroke-width="1"/>
  <path d="M0 18H1200" stroke="url(#line)" stroke-width="2" stroke-dasharray="6 14" opacity=".9">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="600" cy="18" r="3" fill="#98c379" filter="url(#glow)">
    <animate attributeName="cx" values="280;920;280" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".3;1;.3" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
